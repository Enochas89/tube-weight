<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start a Traveler — Fab Shop Floor</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--brand-black); }
  .qa-wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 60px; }
  .qa-header { text-align: center; color: white; margin-bottom: 20px; }
  .qa-header img { height: 52px; background: white; padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; }
  .qa-header h1 { margin: 0 0 6px; font-size: 1.4rem; }
  .qa-header p { margin: 0; opacity: 0.75; font-size: 0.9rem; }
  .qa-card { background: var(--panel); border-radius: 14px; padding: 22px 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.35); }
  .qa-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .qa-field label { font-weight: 700; font-size: 1rem; }
  .qa-field .qa-hint { font-weight: 400; font-size: 0.8rem; color: var(--text-dim); }
  .qa-field input, .qa-field textarea {
    font-family: inherit; font-size: 1.05rem; padding: 14px 12px;
    border: 1px solid var(--border); border-radius: 8px; width: 100%;
  }
  .qa-field textarea { resize: vertical; min-height: 70px; }
  .qa-submit {
    width: 100%; padding: 16px; font-size: 1.1rem; border-radius: 10px;
    background: var(--brand-black); color: white; border: none; cursor: pointer; font-weight: 700;
  }
  .qa-submit:disabled { opacity: 0.6; }
  .qa-message { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.92rem; text-align: center; display: none; }
  .qa-message.success { display: block; background: var(--status-on_track-bg); color: var(--status-on_track); }
  .qa-message.error { display: block; background: var(--status-delayed-bg); color: var(--status-delayed); }
  .qa-links { text-align: center; margin-top: 22px; }
  .qa-links a { color: rgba(255,255,255,0.7); font-size: 0.85rem; text-decoration: none; margin: 0 8px; }
  .qa-links a:hover { color: white; }
  .qa-divider { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin: 22px 0; }
  .qa-file-label {
    display: block; text-align: center; padding: 22px 16px; border: 2px dashed var(--border);
    border-radius: 10px; color: var(--text-dim); font-size: 0.95rem; cursor: pointer;
  }
  .qa-file-label.has-files { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .qa-file-input { display: none; }
  .qa-file-submit {
    width: 100%; padding: 16px; font-size: 1.1rem; border-radius: 10px; margin-top: 14px;
    background: var(--accent); color: white; border: none; cursor: pointer; font-weight: 700;
  }
  .qa-file-submit:disabled { opacity: 0.6; }
  .qa-search-wrap { position: relative; }
  .qa-results {
    margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    max-height: 260px; overflow-y: auto;
  }
  .qa-result {
    display: block; width: 100%; text-align: left; padding: 12px 14px; background: white;
    border: none; border-bottom: 1px solid var(--border); cursor: pointer; font-family: inherit;
  }
  .qa-result:last-child { border-bottom: none; }
  .qa-result:hover, .qa-result:active { background: var(--accent-dim); }
  .qa-result-name { font-weight: 700; font-size: 0.98rem; }
  .qa-result-project { font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; }
  .qa-hint-row { font-size: 0.85rem; color: var(--text-dim); padding: 8px 2px; text-align: center; }
  .qa-selected {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--accent-dim); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px;
  }
  .qa-selected-name { font-weight: 700; }
  .qa-selected-change { background: none; border: none; color: var(--accent); font-weight: 600; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>
<div class="qa-wrap">
  <div class="qa-header">
    <img src="../truck-calculator/logo.png" alt="RetubeCo, Inc.">
    <h1>Start a Traveler</h1>
    <p>Fab Shop Floor</p>
  </div>

  <div class="qa-card">
    <form id="qaClaimForm">
      <div class="qa-field" id="qaSearchField">
        <label for="qaSearch">Enter the traveler number</label>
        <div class="qa-search-wrap">
          <input type="text" id="qaSearch" placeholder="e.g. 11322-1" autocomplete="off">
          <div class="qa-results hidden" id="qaResults"></div>
        </div>
      </div>
      <div class="qa-selected hidden" id="qaSelected">
        <span class="qa-selected-name" id="qaSelectedName"></span>
        <button type="button" class="qa-selected-change" id="qaChangeBtn">Change</button>
      </div>
      <div class="qa-field">
        <label for="qaClaimResponsible">Who's performing the work? <span class="qa-hint">(separate multiple names with commas)</span></label>
        <input type="text" id="qaClaimResponsible" required placeholder="e.g. Jane Doe, Sam Lee" autocomplete="off">
      </div>
      <button type="submit" class="qa-submit" id="qaClaimSubmitBtn" disabled>Start This Traveler</button>
      <div class="qa-message" id="qaClaimMessage"></div>
    </form>
  </div>

  <div class="qa-divider">Or log new work</div>

  <div class="qa-card">
    <form id="qaForm">
      <div class="qa-field">
        <label for="qaName">What are you working on?</label>
        <input type="text" id="qaName" required placeholder="e.g. Machine tubesheets for job 11322" autocomplete="off">
      </div>
      <div class="qa-field">
        <label for="qaResponsible">Who's performing the work? <span class="qa-hint">(separate multiple names with commas)</span></label>
        <input type="text" id="qaResponsible" placeholder="e.g. Jane Doe, Sam Lee" autocomplete="off">
      </div>
      <div class="qa-field">
        <label for="qaNotes">Notes <span class="qa-hint">(optional)</span></label>
        <textarea id="qaNotes" placeholder="Anything else worth flagging"></textarea>
      </div>
      <button type="submit" class="qa-submit" id="qaSubmitBtn">Add to the Shop TV</button>
      <div class="qa-message" id="qaMessage"></div>
    </form>
  </div>

  <div class="qa-divider">Or upload a spreadsheet</div>

  <div class="qa-card">
    <form id="qaFileForm">
      <label class="qa-file-label" id="qaFileLabel" for="qaFileInput">
        Upload a traveler spreadsheet (.xlsx)<br>tap to choose one or more files
      </label>
      <input type="file" id="qaFileInput" class="qa-file-input" accept=".xlsx,.xls" multiple>
      <button type="submit" class="qa-file-submit" id="qaFileSubmitBtn" disabled>Upload &amp; Add to the Shop TV</button>
      <div class="qa-message" id="qaFileMessage"></div>
    </form>
  </div>

  <div class="qa-links">
    <a href="tv.html">View Shop TV</a>
    <a href="index.html">Full App (supervisors)</a>
  </div>
</div>

<script src="vendor/xlsx.core.min.js"></script>
<script src="excel-parser.js"></script>
<script>
  // ---------- Start a Planned Traveler (search + claim) ----------
  const claimForm = document.getElementById("qaClaimForm");
  const searchField = document.getElementById("qaSearchField");
  const searchInput = document.getElementById("qaSearch");
  const resultsEl = document.getElementById("qaResults");
  const selectedEl = document.getElementById("qaSelected");
  const selectedNameEl = document.getElementById("qaSelectedName");
  const changeBtn = document.getElementById("qaChangeBtn");
  const claimResponsible = document.getElementById("qaClaimResponsible");
  const claimSubmitBtn = document.getElementById("qaClaimSubmitBtn");
  const claimMsg = document.getElementById("qaClaimMessage");

  let selectedTraveler = null;
  let searchDebounce = null;

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  async function fetchClaimable(query) {
    const res = await fetch("/api/data");
    const data = await res.json();
    const q = query.trim().toLowerCase();
    const matches = [];
    (data.projects || []).forEach((p) => {
      (p.travelers || []).forEach((t) => {
        if (t.status !== "on_hold") return;
        if (q && !t.name.toLowerCase().includes(q)) return;
        matches.push({ projectId: p.id, projectName: p.name, travelerId: t.id, travelerName: t.name });
      });
    });
    return matches.slice(0, 20);
  }

  function renderResults(matches) {
    if (!matches.length) {
      resultsEl.innerHTML = `<div class="qa-hint-row">No matching traveler waiting to start.</div>`;
    } else {
      resultsEl.innerHTML = matches.map((m, i) => `
        <button type="button" class="qa-result" data-idx="${i}">
          <div class="qa-result-name">${escapeHtml(m.travelerName)}</div>
          <div class="qa-result-project">${escapeHtml(m.projectName)}</div>
        </button>`).join("");
      resultsEl.querySelectorAll(".qa-result").forEach((btn) => {
        btn.addEventListener("click", () => selectTraveler(matches[Number(btn.dataset.idx)]));
      });
    }
    resultsEl.classList.remove("hidden");
  }

  function selectTraveler(m) {
    selectedTraveler = m;
    searchField.classList.add("hidden");
    resultsEl.classList.add("hidden");
    selectedEl.classList.remove("hidden");
    selectedNameEl.textContent = `${m.travelerName} — ${m.projectName}`;
    claimSubmitBtn.disabled = false;
  }

  function clearSelection() {
    selectedTraveler = null;
    searchField.classList.remove("hidden");
    selectedEl.classList.add("hidden");
    searchInput.value = "";
    resultsEl.classList.add("hidden");
    resultsEl.innerHTML = "";
    claimSubmitBtn.disabled = true;
    searchInput.focus();
  }

  searchInput.addEventListener("input", () => {
    clearTimeout(searchDebounce);
    const q = searchInput.value;
    searchDebounce = setTimeout(async () => {
      try {
        const matches = await fetchClaimable(q);
        renderResults(matches);
      } catch (err) {
        resultsEl.innerHTML = `<div class="qa-hint-row">Couldn't load travelers — check your connection.</div>`;
        resultsEl.classList.remove("hidden");
      }
    }, 300);
  });

  changeBtn.addEventListener("click", clearSelection);

  claimForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!selectedTraveler) return;
    const responsible = claimResponsible.value.trim();
    if (!responsible) return;

    claimSubmitBtn.disabled = true;
    claimMsg.className = "qa-message";
    claimMsg.textContent = "";
    try {
      const res = await fetch("/api/data", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "claimTraveler", projectId: selectedTraveler.projectId, travelerId: selectedTraveler.travelerId, responsible }),
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(result.error || "Something went wrong.");
      claimMsg.className = "qa-message success";
      claimMsg.textContent = `Started "${selectedTraveler.travelerName}" — it'll show up on the shop TV shortly.`;
      claimForm.reset();
      clearSelection();
    } catch (err) {
      claimMsg.className = "qa-message error";
      claimMsg.textContent = err.message || "Couldn't start it — check your connection and try again.";
      claimSubmitBtn.disabled = false;
    }
  });

  const form = document.getElementById("qaForm");
  const msg = document.getElementById("qaMessage");
  const submitBtn = document.getElementById("qaSubmitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("qaName").value.trim();
    const responsible = document.getElementById("qaResponsible").value.trim();
    const notes = document.getElementById("qaNotes").value.trim();
    if (!name) return;

    submitBtn.disabled = true;
    msg.className = "qa-message";
    msg.textContent = "";
    try {
      const res = await fetch("/api/data", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "quickAddTraveler", name, responsible, notes }),
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(result.error || "Something went wrong.");
      msg.className = "qa-message success";
      msg.textContent = "Added — it'll show up on the shop TV shortly.";
      form.reset();
    } catch (err) {
      msg.className = "qa-message error";
      msg.textContent = err.message || "Couldn't submit — check your connection and try again.";
    } finally {
      submitBtn.disabled = false;
    }
  });

  const fileForm = document.getElementById("qaFileForm");
  const fileInput = document.getElementById("qaFileInput");
  const fileLabel = document.getElementById("qaFileLabel");
  const fileSubmitBtn = document.getElementById("qaFileSubmitBtn");
  const fileMsg = document.getElementById("qaFileMessage");

  fileInput.addEventListener("change", () => {
    const n = fileInput.files.length;
    fileLabel.classList.toggle("has-files", n > 0);
    fileLabel.textContent = n ? `${n} file${n === 1 ? "" : "s"} selected — tap Upload below` : "Upload a traveler spreadsheet (.xlsx) — tap to choose one or more files";
    fileSubmitBtn.disabled = n === 0;
  });

  fileForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const files = Array.from(fileInput.files);
    if (!files.length) return;

    fileSubmitBtn.disabled = true;
    fileMsg.className = "qa-message";
    fileMsg.textContent = "";
    try {
      const travelers = await ExcelParser.extractTravelersFromFiles(files);
      const res = await fetch("/api/data", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "quickAddTravelers", travelers }),
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(result.error || "Something went wrong.");
      const totalTasks = travelers.reduce((a, t) => a + t.tasks.length, 0);
      fileMsg.className = "qa-message success";
      fileMsg.textContent = `Added ${travelers.length} traveler${travelers.length === 1 ? "" : "s"} (${totalTasks} tasks) — it'll show up on the shop TV shortly.`;
      fileForm.reset();
      fileLabel.classList.remove("has-files");
      fileLabel.textContent = "Upload a traveler spreadsheet (.xlsx) — tap to choose one or more files";
      fileSubmitBtn.disabled = true;
    } catch (err) {
      fileMsg.className = "qa-message error";
      fileMsg.textContent = err.message || "Couldn't upload — check your connection and try again.";
      fileSubmitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
