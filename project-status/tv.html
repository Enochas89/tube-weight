<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Floor — Live</title>
<style>
  :root {
    --tv-bg: #0f1115;
    --tv-panel: #1a1d24;
    --tv-row: #21252e;
    --tv-border: #2c313c;
    --tv-text: #f2f3f5;
    --tv-dim: #9aa2b1;
    --brand-yellow: #f4b400;
    --status-on_track: #00c875;
    --status-at_risk: #fdab3d;
    --status-delayed: #e2445c;
    --status-on_hold: #565c68;
    --status-complete: #00c875;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--tv-bg); color: var(--tv-text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .tv-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 40px; border-bottom: 3px solid var(--brand-yellow);
  }
  .tv-header h1 { margin: 0; font-size: 2rem; letter-spacing: 0.02em; }
  .tv-clock { font-size: 1.4rem; color: var(--tv-dim); font-variant-numeric: tabular-nums; }
  .tv-main { padding: 30px 40px; }
  .tv-empty { text-align: center; color: var(--tv-dim); font-size: 1.6rem; margin-top: 100px; }
  .tv-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 22px; align-items: start;
  }
  .tv-project {
    background: var(--tv-panel); border: 1px solid var(--tv-border); border-radius: 16px;
    padding: 22px 24px; position: relative; overflow: hidden;
  }
  .tv-project-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--brand-yellow); }
  .tv-project-header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-left: 6px; }
  .tv-project-name { font-size: 1.4rem; font-weight: 700; }
  .tv-project-pct { font-size: 1.1rem; color: var(--brand-yellow); font-weight: 700; }

  .tv-checks {
    display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 6px 18px;
  }
  .tv-check { position: relative; width: 22px; height: 22px; flex-shrink: 0; }
  .tv-check svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .tv-check-bg { stroke: #3a3f4a; }
  .tv-check-fill { stroke: var(--status-on_track); transition: clip-path 0.4s ease; }

  .tv-trav-list { display: flex; flex-direction: column; gap: 2px; margin-left: 6px; }
  .tv-trav-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 4px;
    border-top: 1px solid var(--tv-border); transition: opacity 0.3s ease;
  }
  .tv-trav-row:first-child { border-top: none; }
  .tv-trav-row.faded { opacity: 0.4; }
  .tv-trav-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .tv-trav-name { flex: 1; font-size: 1rem; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tv-trav-people { font-size: 0.85rem; color: var(--tv-dim); max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tv-trav-pct { font-size: 0.9rem; color: var(--tv-dim); font-variant-numeric: tabular-nums; width: 38px; text-align: right; flex-shrink: 0; }

  .tv-footer { text-align: center; padding: 16px; color: var(--tv-dim); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="tv-header">
  <h1>Shop Floor — Live</h1>
  <div class="tv-clock" id="tvClock"></div>
</div>
<div class="tv-main" id="tvMain"><div class="tv-empty">Loading…</div></div>
<div class="tv-footer" id="tvFooter"></div>

<script>
  const STATUS_COLOR = {
    on_track: "var(--status-on_track)",
    at_risk: "var(--status-at_risk)",
    delayed: "var(--status-delayed)",
    on_hold: "var(--status-on_hold)",
    complete: "var(--status-complete)",
  };

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }
  function travelerProgress(trav) {
    if (trav.status === "complete") return 100;
    if (trav.status === "on_hold") return 0;
    const counted = trav.tasks.filter((t) => !t.noScheduleImpact);
    if (!counted.length) return 0;
    return Math.round(counted.reduce((a, t) => a + (t.progress || 0), 0) / counted.length);
  }
  function travelerPeople(trav) {
    const names = new Set();
    trav.tasks.forEach((t) => {
      String(t.responsible || "").split(/[,;]/).map((s) => s.trim()).filter(Boolean).forEach((n) => names.add(n));
    });
    return Array.from(names);
  }
  // Active work first, then not-yet-started, then completed (faded) last —
  // whatever needs eyes on it right now floats to the top of the list.
  function travelerRank(status) {
    if (status === "complete") return 2;
    if (status === "on_hold") return 1;
    return 0;
  }

  function checkmarkHtml(pct) {
    const clipTop = Math.max(0, Math.min(100, 100 - pct));
    return `
      <div class="tv-check" title="${pct}%">
        <svg class="tv-check-bg" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
        <svg class="tv-check-fill" viewBox="0 0 24 24" style="clip-path: inset(${clipTop}% 0 0 0);"><path d="M4 12l5 5L20 6"/></svg>
      </div>`;
  }

  function render(data) {
    const main = document.getElementById("tvMain");
    const projects = (Array.isArray(data.projects) ? data.projects : []).filter((p) => (p.travelers || []).length);

    if (!projects.length) {
      main.innerHTML = `<div class="tv-empty">No travelers going right now.</div>`;
      return;
    }

    // Projects with active work bubble to the front; quiet projects (nothing
    // in progress right now) settle toward the back.
    const projectHasActive = (p) => p.travelers.some((t) => travelerRank(t.status) === 0);
    const sortedProjects = [...projects].sort((a, b) => {
      const ar = projectHasActive(a) ? 0 : 1;
      const br = projectHasActive(b) ? 0 : 1;
      return ar - br || a.name.localeCompare(b.name);
    });

    main.innerHTML = `<div class="tv-grid">${sortedProjects.map((project) => {
      // Checkmarks stay in a fixed, stable order (by name) so a traveler's
      // position doesn't jump around as its status changes over time.
      const checkTravelers = [...project.travelers].sort((a, b) => a.name.localeCompare(b.name));
      const checksHtml = checkTravelers.map((t) => checkmarkHtml(travelerProgress(t))).join("");

      const listTravelers = [...project.travelers].sort((a, b) =>
        travelerRank(a.status) - travelerRank(b.status) || a.name.localeCompare(b.name));
      const projectPct = Math.round(project.travelers.reduce((a, t) => a + travelerProgress(t), 0) / project.travelers.length);

      const rowsHtml = listTravelers.map((t) => {
        const color = STATUS_COLOR[t.status] || STATUS_COLOR.on_track;
        const pct = travelerProgress(t);
        const people = travelerPeople(t);
        return `
          <div class="tv-trav-row ${t.status === "complete" ? "faded" : ""}">
            <span class="tv-trav-dot" style="background:${color}"></span>
            <span class="tv-trav-name">${escapeHtml(t.name)}</span>
            ${people.length ? `<span class="tv-trav-people">${escapeHtml(people.join(", "))}</span>` : ""}
            <span class="tv-trav-pct">${pct}%</span>
          </div>`;
      }).join("");

      return `
        <div class="tv-project">
          <div class="tv-project-stripe"></div>
          <div class="tv-project-header">
            <div class="tv-project-name">${escapeHtml(project.name)}</div>
            <div class="tv-project-pct">${projectPct}%</div>
          </div>
          <div class="tv-checks">${checksHtml}</div>
          <div class="tv-trav-list">${rowsHtml}</div>
        </div>`;
    }).join("")}</div>`;
  }

  async function refresh() {
    try {
      const res = await fetch("/api/data");
      const data = await res.json();
      render(data);
      document.getElementById("tvFooter").textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (err) {
      document.getElementById("tvFooter").textContent = "Couldn't refresh — retrying…";
    }
  }

  function tickClock() {
    document.getElementById("tvClock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  tickClock();
  setInterval(tickClock, 1000 * 30);
  refresh();
  setInterval(refresh, 15000);
</script>
</body>
</html>
